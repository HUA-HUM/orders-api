# Ejemplo del Secret que lee deployment.yaml. No commitear valores reales:
# crearlo en el cluster con kubectl (ver README, seccion Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: order-api-secrets
  labels:
    app: order-api
type: Opaque
stringData:
  # URL de VBI (Azure external-sale-create) con ?code=...
  POWERAPPS_API_URL: ""
  # Header x-api-key que exigen todos los endpoints de orders-api
  API_KEY: ""
